name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish from this workflow, not from the branch (which
      # would only show the README). Switch the setting if it isn't already.
      - name: Make Pages publish from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/${{ github.repository }}/pages --jq .build_type || echo unknown)
          echo "Pages build_type: $current"
          if [ "$current" != "workflow" ]; then
            gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow \
              || echo "::warning::Could not switch automatically. In Settings > Pages, set Source to GitHub Actions."
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
